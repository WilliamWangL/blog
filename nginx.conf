# 博客前台页面 (HTTP 重定向到 HTTPS)
server {
    listen 80;
    server_name blog.ecommica.com;
    
    # 强制将所有 HTTP 请求重定向到 HTTPS
    return 301 https://$host$request_uri;
}

# 博客前台页面 (HTTPS)
server {
    listen 443 ssl http2;
    server_name blog.ecommica.com;
    
    # SSL 证书配置 (请确保以下路径的证书存在，如果使用 Certbot 生成，通常位于此路径)
    ssl_certificate /etc/letsencrypt/live/blog.ecommica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.ecommica.com/privkey.pem;
    
    # SSL 优化配置 (推荐)
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 代理到本机的 3000 端口
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

